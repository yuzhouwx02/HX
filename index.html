function isMediaBase64(str) { if (typeof str !== 'string') return false; const s = cleanBase64(str); return s.startsWith('data:image/') || s.startsWith('data:video/'); }
function isImageUrl(str) { return typeof str === 'string' && (str.startsWith('http://') || str.startsWith('https://')); }
function formatQuoteText(raw) { if (typeof raw !== 'string') return ''; if (isMediaBase64(raw) || isImageUrl(raw)) { if (isMediaBase64(raw)) { if (raw.startsWith('data:image/')) return '📷 图片'; if (raw.startsWith('data:video/')) return '🎬 视频'; return '[媒体]'; } return '🖼️ 图片'; } return raw; }
function getBeijingTime(d) { const date = d || new Date(); const offset = 8*3600*1000; return new Date(date.getTime() + date.getTimezoneOffset()*60000 + offset); }
function formatHM(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function formatFullTime(d) { const bj = getBeijingTime(d); return bj.getFullYear()+'-'+String(bj.getMonth()+1).padStart(2,'0')+'-'+String(bj.getDate()).padStart(2,'0')+' '+formatHM(bj); }
function getDayKeyFromTime(full) { return full && full.length>=10 ? full.substring(0,10) : ''; }
function getTimeHMFromFull(full) { return full && full.length>=16 ? full.substring(11,16) : ''; }
function findLastIndex(arr, pred) { for(let i=arr.length-1; i>=0; i--) if(pred(arr[i],i,arr)) return i; return -1; }
function escapeHtml(str) { if(!str) return ''; const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function isAtBottom(el) { if(!el) return true; return el.scrollHeight - el.scrollTop - el.clientHeight < 40; }

function formatDateLabel(dateStr, timeStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-').map(Number);
    const msgDate = new Date(parts[0], parts[1]-1, parts[2]);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.floor((today - msgDate) / (24*60*60*1000));
    let label = '';
    if (diffDays === 0) {
        label = dateStr;
    } else if (diffDays > 0 && diffDays <= 6) {
        const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        label = weekdays[msgDate.getDay()];
    } else if (diffDays > 6 && diffDays < 365) {
        label = String(parts[1]) + '/' + String(parts[2]).padStart(2,'0');
    } else if (diffDays >= 365) {
        label = String(parts[0]) + '/' + String(parts[1]).padStart(2,'0') + '/' + String(parts[2]).padStart(2,'0');
    } else {
        label = dateStr;
    }
    return label + ' ' + timeStr;
}

function loadData() {
    try {
        const saved = localStorage.getItem('CALEB_CHAT_DATA');
        if (saved) {
            const parsed = JSON.parse(saved);
            Object.assign(DATA, parsed);
            if (!DATA.emojiGroups) DATA.emojiGroups = { "emoji": ["🥺","😋","😽","🥰","😈","🍏","🍎","💕","🐈","🐆","👌","😉","💤","😭","😍","😘","🙂‍↕️","🤏","😇","☺️","😘","😚","🥳","😎","🥵","🤬","😳","😢","🫣","🥶","🥱","😪","🤧","😴","😵‍💫","🤕","🤲🏻","🫶🏻","🙌🏻","👊🏻","👉🏻","🫳🏻","✌🏻","👂🏻","✍🏻","🦷","👀","🫂","🫀","👅","👄"] };
            if (!DATA.aiWordGroups) DATA.aiWordGroups = {};
            if (!DATA.myPatCards) DATA.myPatCards = [];
            if (!DATA.partnerPatCards) DATA.partnerPatCards = [];
            if (parsed.patCards && parsed.patCards.length && !DATA.partnerPatCards.length) {
                DATA.partnerPatCards = parsed.patCards;
                DATA.myPatCards = [];
            }
            if (!DATA.settings) DATA.settings = {};
            if (!DATA.settings.skin) DATA.settings.skin = { top: '#ffffff', bottom: '#ffffff' };
            if (!DATA.settings.statusCards) DATA.settings.statusCards = [];
            if (!DATA.state) DATA.state = { lastStatusUpdate: Date.now(), statusIndex: 0 };
            if (!DATA.state.lastStatusUpdate) DATA.state.lastStatusUpdate = Date.now();
            const defaults = { enableBackgroundKeep:false, enableMsgNotify:false, ignoreRate:0.1, quoteRate:0.25,
                replyMinMinutes:1, replyMaxSeconds:30, replyCountMin:1, replyCountMax:3,
                customGlobalCSS:'', customBubbleCSS:'', enableCombineCards:false, combineCardsCount:2,
                enableActiveSend:false, activeSendMinMinutes:20, activeSendMaxMinutes:40,
                statusChangeMinHours:3, statusChangeMaxHours:5 };
            Object.keys(defaults).forEach(k => { if(DATA.settings[k]===undefined) DATA.settings[k]=defaults[k]; });
            DATA.messages.forEach(m => { if(!m.fullTime) { const now=getBeijingTime(); m.fullTime=formatFullTime(now); } });
        } else { applyPresets(); }
    } catch(e) { console.warn('加载失败',e); applyPresets(); }
}
function applyPresets() {
    DATA.aiWordGroups = JSON.parse(JSON.stringify(PRESET_WORD_GROUPS));
    DATA.partnerPatCards = [...PRESET_PAT_CARDS];
    DATA.myPatCards = [...PRESET_PAT_CARDS];
    DATA.settings.statusCards = [...PRESET_STATUS_CARDS];
    DATA.emojiGroups = { "emoji": ["🥺","😋","😽","🥰","😈","🍏","🍎","💕","🐈","🐆","👌","😉","💤","😭","😍","😘","🙂‍↕️","🤏","😇","☺️","😘","😚","🥳","😎","🥵","🤬","😳","😢","🫣","🥶","🥱","😪","🤧","😴","😵‍💫","🤕","🤲🏻","🫶🏻","🙌🏻","👊🏻","👉🏻","🫳🏻","✌🏻","👂🏻","✍🏻","🦷","👀","🫂","🫀","👅","👄"] };
    if (!DATA.state) DATA.state = { lastStatusUpdate: Date.now(), statusIndex: 0 };
    DATA.state.lastStatusUpdate = Date.now();
    saveData();
}
function saveData() {
    try { localStorage.setItem('CALEB_CHAT_DATA', JSON.stringify(DATA)); }
    catch(err) { alert('存储空间不足，请导出备份清理'); console.error(err); }
}

function requestNotificationPermission() { if(!window.Notification) return; if(Notification.permission==='granted'||Notification.permission==='denied') return; Notification.requestPermission(); }
function sendDesktopNotify(msgText) {
    if(!DATA.settings.enableMsgNotify || !window.Notification) return;
    if(Notification.permission==='denied') return;
    if(Notification.permission==='granted') { new Notification('CALEB 新消息', { body: msgText, requireInteraction: true }); return; }
    Notification.requestPermission().then(p => { if(p==='granted') new Notification('CALEB 新消息', { body: msgText, requireInteraction: true }); });
}

function toggleBackgroundKeep() {
    if(bgKeepTimer) clearInterval(bgKeepTimer);
    if(!DATA.settings.enableBackgroundKeep) return;
    bgKeepTimer = setInterval(() => {
        const now = Date.now(), diff = now - DATA.state.lastStatusUpdate;
        const minGap = DATA.settings.statusChangeMinHours*3600*1000, maxGap = DATA.settings.statusChangeMaxHours*3600*1000;
        if(diff >= minGap) {
            const rand = Math.floor(Math.random()*(maxGap-minGap)) + minGap;
            if(diff >= rand && DATA.settings.statusCards.length) {
                DATA.partner.status = DATA.settings.statusCards[Math.floor(Math.random()*DATA.settings.statusCards.length)];
                DATA.state.lastStatusUpdate = now;
                saveData(); renderPartnerInfo();
            }
        }
        if(document.hidden) document.title = document.title===originalTitle ? '【新消息】CALEB' : originalTitle;
        else document.title = originalTitle;
    }, 1500);
}

function renderMessages(keepScroll) {
    const area = document.getElementById('chatArea');
    const shouldScroll = !keepScroll || isAtBottom(area);
    area.innerHTML = '';
    let lastDay='', lastTs=0;
    DATA.messages.forEach((msg, idx) => {
        const full = msg.fullTime || '', day = getDayKeyFromTime(full), hm = getTimeHMFromFull(full) || msg.time || '00:00';
        if(lastDay!==day && day) {
            const d=document.createElement('div');
            d.className='time-divider';
            d.textContent = formatDateLabel(day, hm);
            area.appendChild(d);
            lastDay=day;
            lastTs=0;
        }
        if(full) { const ts=new Date(full).getTime(); if(lastTs && ts-lastTs>=TIME_DIVIDE_INTERVAL) { const d=document.createElement('div'); d.className='time-divider'; d.textContent=hm; area.appendChild(d); } lastTs=ts; }
        if(msg.from==='system' || msg.patMsg) {
            const c=document.createElement('div');
            c.className = 'center-notice' + (msg.patMsg ? ' pat-msg' : '');
            c.textContent=msg.text||'';
            area.appendChild(c);
            return;
        }
        const wrap=document.createElement('div'); wrap.dataset.idx=idx; wrap.className=`msg-wrap ${msg.from==='me'?'right':'left'}`;
        (function(i) {
            wrap.addEventListener('touchstart', e=>{ longPressTimer=setTimeout(()=>showLongMenu(i,wrap), LONG_PRESS_DELAY); }, {passive:true});
            wrap.addEventListener('touchend', ()=>{ clearTimeout(longPressTimer); }, {passive:true});
            wrap.addEventListener('touchcancel', ()=>{ clearTimeout(longPressTimer); }, {passive:true});
            wrap.addEventListener('contextmenu', e=>{ e.preventDefault(); showLongMenu(i,wrap); });
            wrap.addEventListener('dblclick', function(e){ showLongMenu(i,wrap); });
        })(idx);
        let html=`<div class="message">`;
        if(msg.quoteIdx!==undefined && DATA.messages[msg.quoteIdx]) {
            const q=DATA.messages[msg.quoteIdx], txt=formatQuoteText(q.text);
            html+=`<div class="quote-in" data-jump="${idx}">${escapeHtml(txt)}</div>`;
        }
        if(msg.type==='image') {
            html+=`<img src="${msg.text}" loading="lazy">`;
        } else if(msg.type==='video') {
            html+=`<video src="${msg.text}" controls></video>`;
        } else {
            html+=`<div>${escapeHtml(msg.text)}</div>`;
        }
        html+=`</div>`;
        wrap.innerHTML = html;
        wrap.querySelectorAll('[data-jump]').forEach(el=>{
            el.addEventListener('click', function(){ jumpToQuote(parseInt(this.dataset.jump)); });
        });
        area.appendChild(wrap);
    });
    if(shouldScroll) area.scrollTop = area.scrollHeight;
    applyWallpaper();
}
function applyWallpaper() { const area=document.getElementById('chatArea'); if(DATA.settings.wallpaper) area.style.backgroundImage=`url(${cleanBase64(DATA.settings.wallpaper)})`; else area.style.backgroundImage=''; }
function jumpToQuote(idx) { const msg=DATA.messages[idx]; if(!msg || msg.quoteIdx===undefined) return; const target=document.querySelectorAll('.msg-wrap')[msg.quoteIdx]; if(!target) return; target.scrollIntoView({behavior:'smooth',block:'center'}); target.classList.add('flash'); setTimeout(()=>target.classList.remove('flash'),1500); }

function showLongMenu(idx, el) {
    longPressTargetIdx=idx; const menu=document.getElementById('longMenu');
    const rect=el.getBoundingClientRect(); let left=rect.left+10, top=rect.top-60;
    if(left+120>window.innerWidth) left=rect.left-120; if(left<10) left=10; if(top<10) top=rect.bottom+10; if(top+80>window.innerHeight) top=window.innerHeight-90;
    menu.style.left=left+'px'; menu.style.top=top+'px'; menu.classList.add('show');
    const close=(e)=>{ if(!menu.contains(e.target)){ hideLongMenu(); document.removeEventListener('click',close); } };
    setTimeout(()=>document.addEventListener('click',close), 50);
    menu.querySelectorAll('[data-action]').forEach(el2=>{
        el2.onclick = function(e){
            e.stopPropagation();
            if(this.dataset.action==='quote') { if(longPressTargetIdx!==null) replyMessage(longPressTargetIdx); }
            else if(this.dataset.action==='delete') { if(longPressTargetIdx!==null) deleteSelectedMsg(); }
            hideLongMenu(); document.removeEventListener('click',close);
        };
    });
}
function hideLongMenu() { document.getElementById('longMenu').classList.remove('show'); }
function deleteSelectedMsg() {
    if(longPressTargetIdx===null) return; if(!confirm('删除此消息？')) return;
    const del=longPressTargetIdx; DATA.messages.splice(del,1);
    DATA.messages.forEach(m=>{ if(m.quoteIdx!==undefined){ if(m.quoteIdx===del) m.quoteIdx=undefined; else if(m.quoteIdx>del) m.quoteIdx--; } });
    longPressTargetIdx=null; saveData(); renderMessages(true); alert('已删除');
}

function replyMessage(idx) {
    const msg=DATA.messages[idx]; if(!msg) return;
    pendingReplyIdx=idx;
    const bar=document.getElementById('quoteBar'), text=document.getElementById('quoteText');
    text.textContent = '引用: ' + formatQuoteText(msg.text);
    bar.style.display='flex';
    document.getElementById('msgInput').value='';
    delete document.getElementById('msgInput').dataset.hasInput;
    document.getElementById('msgInput').focus();
}
function cancelQuote() { pendingReplyIdx=null; document.getElementById('quoteBar').style.display='none'; document.getElementById('msgInput').focus(); }

function handleSendClick() {
    const input=document.getElementById('msgInput'), text=input.value.trim();
    if(!text){ if(pendingReplyIdx!==null) cancelQuote(); return; }
    const quote=pendingReplyIdx; pendingReplyIdx=null; document.getElementById('quoteBar').style.display='none';
    sendSingleMessage(text, quote);
    input.value=''; delete input.dataset.hasInput; input.focus();
}
function sendSingleMessage(text, quoteIdx, type) {
    const now=getBeijingTime(), full=formatFullTime(now), hm=formatHM(now);
    DATA.messages.push({ from:'me', text, time:hm, fullTime:full, quoteIdx:quoteIdx!==undefined?quoteIdx:undefined, type:type||'text' });
    saveData(); renderMessages(false); simulatePartnerReply(false);
}

// ===== 对方回复 =====
function simulatePartnerReply(force, isActive) {
    if (replyTimer) {
        clearTimeout(replyTimer);
        replyTimer = null;
    }
    if(!force && Math.random()<DATA.settings.ignoreRate) {
        const now = getBeijingTime();
        DATA.messages.push({ from:'system', text:`${DATA.partner.name}已读不回`, time:formatHM(now), fullTime:formatFullTime(now) });
        saveData();
        renderMessages(false);
        setTimeout(restorePartnerStatus, 2000);
        return;
    }
    const minMin=Number(DATA.settings.replyMinMinutes)||1, maxSec=Number(DATA.settings.replyMaxSeconds)||30;
    const delay=Math.floor(Math.random()*(maxSec*1000)) + minMin*60*1000;
    const countMin=Math.max(1,Number(DATA.settings.replyCountMin)||1), countMax=Math.max(1,Number(DATA.settings.replyCountMax)||3);
    const count=Math.floor(Math.random()*(countMax-countMin+1))+countMin;
    let wordPool=[]; Object.values(DATA.aiWordGroups).forEach(arr=>wordPool.push(...arr));
    let emojiPool=[]; Object.values(DATA.emojiGroups).forEach(arr=>emojiPool.push(...arr));
    if(wordPool.length===0) wordPool=['嗯','好的'];
    setPartnerStatus('对方正在输入...','typing');
    replyTimer = setTimeout(()=>{
        replyTimer = null;
        const now=getBeijingTime(), full=formatFullTime(now), hm=formatHM(now);
        if(Math.random()<0.03 && DATA.partnerPatCards.length) {
            const act=DATA.partnerPatCards[Math.floor(Math.random()*DATA.partnerPatCards.length)];
            DATA.messages.push({ from:'partner', text:`${DATA.partner.name}${act}`, time:hm, fullTime:full, patMsg:true });
            saveData(); renderMessages(false); sendDesktopNotify(`${DATA.partner.name}${act}`); restorePartnerStatus(); return;
        }
        const items=[];
        for(let i=0;i<count;i++) {
            let pick, type='text';
            if(Math.random()<=0.25 && emojiPool.length) {
                pick=emojiPool[Math.floor(Math.random()*emojiPool.length)];
                if (isMediaBase64(pick) || isImageUrl(pick)) type = 'image';
                else type = 'text';
            } else {
                pick=wordPool[Math.floor(Math.random()*wordPool.length)];
                type='text';
            }
            items.push({text:pick, type});
        }
        let quoteIdx=undefined;
        if(!isActive && Math.random()<DATA.settings.quoteRate) {
            const threeHoursAgo = new Date(now.getTime() - 3*60*60*1000);
            const candidates = DATA.messages.reduce((acc, m, idx) => {
                if (m.from === 'me' && !m.patMsg && m.from !== 'system') {
                    const msgTime = new Date(m.fullTime);
                    if (msgTime >= threeHoursAgo && msgTime <= now) {
                        acc.push(idx);
                    }
                }
                return acc;
            }, []);
            if (candidates.length > 0) {
                const randIdx = candidates[Math.floor(Math.random() * candidates.length)];
                quoteIdx = randIdx;
            } else {
                const last = findLastIndex(DATA.messages, m=>m.from==='me' && !m.patMsg && m.from!=='system');
                if(last>-1) quoteIdx = last;
            }
        }
        const combine=DATA.settings.enableCombineCards, combineCount=Math.max(1,Number(DATA.settings.combineCardsCount)||2);
        const textItems=items.filter(it=>it.type==='text'), imageItems=items.filter(it=>it.type==='image');
        let toSend=[];
        if(combine) {
            let combined=[];
            for(let i=0;i<textItems.length;i+=combineCount) {
                const chunk=textItems.slice(i,i+combineCount).map(it=>it.text);
                combined.push(chunk.join('\n'));
            }
            combined.forEach(txt=>toSend.push({text:txt, type:'text'}));
            imageItems.forEach(img=>toSend.push({text:img.text, type:'image'}));
        } else {
            items.forEach(it=>toSend.push({text:it.text, type:it.type}));
        }
        toSend.forEach((msg,index)=>{
            const d=new Date(now.getTime()+index*800), f=formatFullTime(d), h=formatHM(d);
            DATA.messages.push({ from:'partner', text:msg.text, time:h, fullTime:f, quoteIdx, type:msg.type });
        });
        saveData(); renderMessages(false);
        const nt=toSend.map(m=>m.type==='image'?'[图片]':m.text).join(' ');
        sendDesktopNotify(`${DATA.partner.name}: ${nt}`);
        restorePartnerStatus();
    }, delay);
}
function setPartnerStatus(text, cls) {
    const el=document.getElementById('partnerStatus');
    if(el) {
        el.textContent=text;
        el.className='status '+(cls||'');
        if(cls !== 'typing' && cls !== 'read') {
            DATA.partner.status = text;
            DATA.state.lastStatusUpdate = Date.now();
            saveData();
        }
    }
}
function restorePartnerStatus() {
    const el = document.getElementById('partnerStatus');
    if (!el) return;
    const now = Date.now();
    const minGap = DATA.settings.statusChangeMinHours * 3600 * 1000;
    if (now - DATA.state.lastStatusUpdate >= minGap) {
        const list = DATA.settings.statusCards;
        if (list && list.length) {
            DATA.partner.status = list[Math.floor(Math.random() * list.length)];
            DATA.state.lastStatusUpdate = now;
            saveData();
        }
    }
    el.className = 'status';
    el.textContent = DATA.partner.status;
}

function triggerAutoReply() {
    simulatePartnerReply(true,false);
    const now=getBeijingTime();
    DATA.messages.push({ from:'system', text:'已触发回复', time:formatHM(now), fullTime:formatFullTime(now) });
    saveData(); renderMessages(false);
}

function handleMoreClick(event) {
    event.stopPropagation();
    const panel = document.getElementById('patMiniPanel');
    const content = document.getElementById('patMiniContent');
    content.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px;padding:4px 0;">
            <button class="action-btn primary" onclick="doTriggerReply()" style="width:100%;">触发回复</button>
            <button class="action-btn danger" onclick="doInterruptReply()" style="width:100%;">打断回复</button>
        </div>
    `;
    const rect = event.target.getBoundingClientRect();
    const appRect = document.getElementById('app').getBoundingClientRect();
    let left = rect.left - appRect.left + 10;
    let top = rect.top - appRect.top - 100;
    let w = 180;
    if (left + w > appRect.width) left = appRect.width - w - 10;
    if (left < 10) left = 10;
    if (top < 10) top = rect.bottom - appRect.top + 10;
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    panel.style.display = 'block';
    document.addEventListener('click', closeMorePanelOutside, {once:true});
}
function closeMorePanelOutside(e) {
    const panel = document.getElementById('patMiniPanel');
    if (!panel.contains(e.target)) {
        panel.style.display = 'none';
    }
}
function doTriggerReply() {
    closePatMini();
    triggerAutoReply();
}
function doInterruptReply() {
    closePatMini();
    if (replyTimer) {
        clearTimeout(replyTimer);
        replyTimer = null;
        const now = getBeijingTime();
        DATA.messages.push({ from:'system', text:'已打断回复', time:formatHM(now), fullTime:formatFullTime(now) });
        saveData();
        renderMessages(false);
        restorePartnerStatus();
    } else {
        const now = getBeijingTime();
        DATA.messages.push({ from:'system', text:'当前没有可打断的回复', time:formatHM(now), fullTime:formatFullTime(now) });
        saveData();
        renderMessages(false);
    }
}

function closePatMini() {
    document.getElementById('patMiniPanel').style.display = 'none';
}

function startActiveSendTimer() { stopActiveSendTimer(); if(DATA.settings.enableActiveSend) scheduleActiveSend(); }
function stopActiveSendTimer() { if(activeSendTimer){ clearTimeout(activeSendTimer); activeSendTimer=null; } }
function scheduleActiveSend() {
    if(!DATA.settings.enableActiveSend) return;
    const min=Number(DATA.settings.activeSendMinMinutes)||20, max=Number(DATA.settings.activeSendMaxMinutes)||40;
    const delay = max<=min ? min*60*1000 : Math.floor(Math.random()*(max-min)*60000)+min*60000;
    activeSendTimer = setTimeout(()=>{ simulatePartnerReply(true,true); scheduleActiveSend(); }, delay);
}

function sendPat(text) {
    const now=getBeijingTime(); DATA.messages.push({ from:'me', text:`我${text}`, time:formatHM(now), fullTime:formatFullTime(now), patMsg:true });
    saveData(); renderMessages(false); simulatePartnerReply(false);
}
function openPatMini(event) {
    event.stopPropagation();
    const panel=document.getElementById('patMiniPanel'), content=document.getElementById('patMiniContent');
    let html='';
    DATA.myPatCards.forEach(p=>{ html+=`<span class="pat-tag" data-pat="${escapeHtml(p)}">${escapeHtml(p)}</span>`; });
    content.innerHTML=html;
    content.querySelectorAll('.pat-tag').forEach(el=>{
        el.addEventListener('click', function(){ sendPat(this.dataset.pat); closePatMini(); });
    });
    const rect=document.getElementById('partnerInfo').getBoundingClientRect(), app=document.getElementById('app').getBoundingClientRect();
    let left=rect.left-app.left+10, top=rect.bottom-app.top+6, w=260;
    if(left+w>app.width) left=app.width-w-10; if(left<10) left=10;
    panel.style.left=left+'px'; panel.style.top=top+'px'; panel.style.display='block';
    document.addEventListener('click', closePatMiniOutside, {once:true});
}
function closePatMiniOutside(e) { const panel=document.getElementById('patMiniPanel'); if(!panel.contains(e.target)) closePatMini(); }

function updatePartnerAvatar(e) {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{ DATA.partner.avatar=cleanBase64(ev.target.result); saveData(); renderPartnerInfo(); };
    reader.readAsDataURL(file);
    e.target.value='';
}
function setAvatarByUrl() {
    const url=document.getElementById('avatarUrlInput').value.trim();
    if(!url) return alert('请输入图片URL');
    DATA.partner.avatar = url;
    saveData(); renderPartnerInfo(); closePanel(); alert('头像已更新');
}
function renderPartnerInfo() {
    const avatar=document.getElementById('partnerAvatar'); let img=avatar.querySelector('img');
    if(DATA.partner.avatar) {
        if(!img){ img=document.createElement('img'); avatar.innerHTML=''; avatar.appendChild(img); }
        img.src = DATA.partner.avatar;
    } else {
        avatar.innerHTML='<i class="fas fa-user"></i>';

function openMediaUpload() { document.getElementById('mediaUploadInput').click(); }
function directSendMedia(e) {
    const files=e.target.files; let finish=0, total=files.length; if(!total) return;
    for(const f of files) {
        const reader=new FileReader();
        reader.onload=ev=>{
            const now=getBeijingTime(); const type=f.type.startsWith('video')?'video':'image';
            const data = cleanBase64(ev.target.result);
            DATA.messages.push({ from:'me', text:data, time:formatHM(now), fullTime:formatFullTime(now), type });
            if(++finish===total){ saveData(); renderMessages(false); simulatePartnerReply(false); }
        };
        reader.readAsDataURL(f);
    }
    e.target.value='';
}

function selectEmojiItem(data) {
    const now=getBeijingTime(), full=formatFullTime(now), hm=formatHM(now);
    let type='text';
    if(isMediaBase64(data) || isImageUrl(data)) type='image';
    DATA.messages.push({ from:'me', text:data, time:hm, fullTime:full, type });
    saveData(); renderMessages(false); closePanel(); simulatePartnerReply(false);
}

}

    indices.forEach(i => arr.splice(i,1));
    partnerPatSelected.clear();
    saveData();
    openPanel('settingsPanel');
    alert('删除成功');
}

function handleWordJsonImport(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const json = JSON.parse(ev.target.result);
            let count = 0;
            if (typeof json === 'object' && !Array.isArray(json)) {
                Object.keys(json).forEach(group => {
                    if(Array.isArray(json[group])) {
                        if(!DATA.aiWordGroups[group]) DATA.aiWordGroups[group] = [];
                        const arr = json[group].filter(s => typeof s === 'string' && s.trim());
                        DATA.aiWordGroups[group].push(...arr);
                        count += arr.length;
                    }
                });
            } else if (Array.isArray(json)) {
                const defaultGroup = '导入字卡';
                if(!DATA.aiWordGroups[defaultGroup]) DATA.aiWordGroups[defaultGroup] = [];
                const arr = json.filter(s => typeof s === 'string' && s.trim());
                DATA.aiWordGroups[defaultGroup].push(...arr);
                count = arr.length;
            } else {
                alert('JSON格式无效，请提供对象 {"分组名":["词条"]} 或数组 ["词条"]');
                return;
            }
            aiDeduplicate();
            saveData();
            openPanel('aiWordPanel');
            alert(`成功导入 ${count} 个字卡`);
        } catch(err) {
            alert('❌ JSON解析失败，请检查格式');
            console.error(err);
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

function importEmojiImages(e) {

    }
    e.target.value='';
}

            if(!DATA.aiWordGroups) DATA.aiWordGroups={};
            if(!DATA.myPatCards) DATA.myPatCards=[];
            if(!DATA.partnerPatCards) DATA.partnerPatCards=[];
            if(!DATA.settings) DATA.settings={};
            if(!DATA.settings.skin) DATA.settings.skin={top:'#ffffff',bottom:'#ffffff'};
            if(!DATA.settings.statusCards) DATA.settings.statusCards=[];
            if(!DATA.state) DATA.state={lastStatusUpdate:Date.now(), statusIndex:0};
            const defaults={enableBackgroundKeep:false, enableMsgNotify:false, ignoreRate:0.1, quoteRate:0.25,
                replyMinMinutes:1, replyMaxSeconds:30, replyCountMin:1, replyCountMax:3,
                customGlobalCSS:'', customBubbleCSS:'', enableCombineCards:false, combineCardsCount:2,
                enableActiveSend:false, activeSendMinMinutes:20, activeSendMaxMinutes:40,
                statusChangeMinHours:3, statusChangeMaxHours:5 };
            Object.keys(defaults).forEach(k=>{ if(DATA.settings[k]===undefined) DATA.settings[k]=defaults[k]; });
            DATA.messages.forEach(m=>{ if(!m.fullTime){ const now=getBeijingTime(); m.fullTime=formatFullTime(now); } });
            saveData(); renderPartnerInfo(); renderMessages(false); applySkin(); toggleBackgroundKeep(); applyCustomCSS(); startActiveSendTimer(); closePanel(); alert('✅ 导入成功');
        } catch(err) { alert('❌ 文件格式错误'); console.error(err); }
    };
    reader.readAsText(file);

}

function generateBackgroundMessages() {
    if (!DATA.messages.length) return;
    const lastMsg = DATA.messages[DATA.messages.length-1];
    if (!lastMsg.fullTime) return;
    const lastTime = new Date(lastMsg.fullTime).getTime();
    const now = Date.now();
    const diffMinutes = (now - lastTime) / 60000;
    if (diffMinutes < 30) return;
    const count = Math.min(Math.floor(diffMinutes / 30), 5);
    if (count <= 0) return;
    let wordPool = [];
    Object.values(DATA.aiWordGroups).forEach(arr => wordPool.push(...arr));
    if (wordPool.length === 0) wordPool = ['嗯', '好的'];
    for (let i = 0; i < count; i++) {
        const msgTime = new Date(lastTime + (i+1)*60000);
        const full = formatFullTime(msgTime);
        const hm = formatHM(msgTime);
        const text = wordPool[Math.floor(Math.random() * wordPool.length)];
        DATA.messages.push({
            from: 'partner',
            text: text,
            time: hm,
            fullTime: full,
            type: 'text'
        });
    }
    saveData();
}
